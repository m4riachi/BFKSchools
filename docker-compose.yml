# Local services for development: PostgreSQL (bfk_dev + bfk_test) and Mailpit.
#   docker compose up -d
# Mailpit UI: http://localhost:8025 (SMTP on 1025, set MAIL_MAILER=smtp)
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bfk
      POSTGRES_PASSWORD: bfk
      POSTGRES_DB: bfk_dev
      TZ: Africa/Casablanca
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bfk -d bfk_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
